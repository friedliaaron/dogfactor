name: Spiele aktualisieren

# Jeden Montag: Spielplan der laufenden Saison neu einlesen und Resultate der vergangenen
# Spiele holen (scrape_games.R daily; montags wird auch die Wochenansicht neu gescannt).
on:
  schedule:
    - cron: "0 5 * * 1"    # Montag 05:00 UTC (06:00 Winterzeit / 07:00 Sommerzeit)
  workflow_dispatch:       # manuell starten: Actions > Spiele aktualisieren > Run workflow

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rvest
            any::chromote
            any::xml2
            any::readr
            any::dplyr
            any::stringr
            any::purrr

      - name: Spiele holen
        run: Rscript scrape_games.R daily

      - name: Neue Daten committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/games.csv app/data/game_ids.csv
          if git diff --cached --quiet; then
            echo "Keine Aenderung."
          else
            git commit -m "Spiele $(date -u +%F)"
            git pull --rebase
            git push
          fi
