name: Rangliste abrufen

on:
  schedule:
    - cron: "17 4 * * *"   # taeglich 04:17 UTC (05:17 / 06:17 Schweizer Zeit)
  workflow_dispatch:       # manuell starten: Actions > Rangliste abrufen > Run workflow

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rvest
            any::chromote
            any::readr
            any::dplyr
            any::stringr

      - name: Rangliste holen
        run: Rscript scrape_ranking.R

      - name: Neue Daten committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/ranking_history.csv
          if git diff --cached --quiet; then
            echo "Keine Aenderung."
          else
            git commit -m "Rangliste $(date -u +%F)"
            git push
          fi
